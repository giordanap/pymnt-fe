name: react-candidate
services:
  web:
    container_name: react-candidate-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # External users API. Defaults to JSONPlaceholder when not set.
      NEXT_PUBLIC_USERS_API_URL: ${NEXT_PUBLIC_USERS_API_URL:-https://jsonplaceholder.typicode.com/users}
